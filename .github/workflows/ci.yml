name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Typecheck
      run: bun run typecheck

    - name: Lint
      run: bun run lint

    - name: Build
      run: bun run build

    - name: Verify build output
      run: |
        test -f dist/index.js
        test -d dist/operations
        test -d dist/language-servers
        test -d dist/utils

    - name: Run tests
      run: bun run test

  fresh-install:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Build
      run: bun run build

    # Every other job runs inside this repo, where node_modules/typescript always
    # exists. This one packs the server and refactors a project that has none.
    - name: Refactor from a packed install
      run: bun run test:fresh-install

  node-compat:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Build
      run: bun run build

    # Speak MCP to the built server: it must answer initialize and tools/list with
    # nothing but JSON-RPC on stdout, then exit cleanly once stdin closes. Its
    # stderr, crash traces included, streams straight into this log.
    - name: Verify server answers MCP on Node.js ${{ matrix.node-version }}
      run: |
        response=$(printf '%s\n' \
          '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
          '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
          '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | timeout 60 node dist/index.js) && status=0 || status=$?
        if [ "$status" -ne 0 ] || ! node -e '
          const replies = require("fs").readFileSync(0, "utf8").trim().split("\n").map((line) => JSON.parse(line));
          const init = replies.find((reply) => reply.id === 1);
          const list = replies.find((reply) => reply.id === 2);
          if (!init?.result?.protocolVersion || !list?.result?.tools?.length) process.exit(1);
          console.log("Node.js " + process.version + ": protocol " + init.result.protocolVersion + ", tools " + list.result.tools.map((tool) => tool.name).join(", "));
        ' <<<"$response"; then
          echo "::error::Server did not answer MCP on Node.js ${{ matrix.node-version }} (exit status $status; 124 = timed out). Its stdout:"
          printf '%s\n' "$response"
          exit 1
        fi
